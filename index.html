<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b4476b">
  <meta name="description" content="Agenda de sintomas gratuita para acompanhar a menopausa: registre, identifique padrões e receba orientações. Desenvolvido por PeralIA Tech.">
  <title>Você no Controle da Menopausa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Você no Controle <span>da Menopausa</span></h1>
    <button id="text-size" class="size-btn" type="button" aria-label="Alterar tamanho do texto">A+</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="credit">
    <b>App de apoio:</b> não faz diagnóstico, não indica tratamento e não substitui consulta com profissional de saúde.<br>
    Agenda de sintomas gratuita · Desenvolvido por <b>PeralIA Tech</b>
  </footer>

  <nav class="tabbar" aria-label="Navegação principal">
    <button data-tab="hoje" aria-label="Registro do dia"><i>📝</i>Hoje</button>
    <button data-tab="historico" aria-label="Histórico"><i>📅</i>Histórico</button>
    <button data-tab="padroes" aria-label="Padrões"><i>📈</i>Padrões</button>
    <button data-tab="guia" aria-label="Guia de orientações"><i>💡</i>Guia</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
